services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: demand-advisor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: advisor
      POSTGRES_PASSWORD: advisor_dev_password
      POSTGRES_DB: demand_advisor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisor -d demand_advisor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
