[project]
name = "demand-reorder-advisor"
version = "0.1.0"
description = "Single-agent demand forecast + policy/inventory verification (v1)"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "langsmith>=0.1",
    "litellm>=1.50",
    "instructor>=1.5",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "prophet>=1.1",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.38",
    "mlflow>=2.16",
    "jupyter>=1.1.1",
    "tdqm>=0.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
